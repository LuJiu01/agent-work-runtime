# Local PostgreSQL 17 for Team V1 verification. Not a production topology.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: awr-test
      POSTGRES_DB: awr_team_test
    ports:
      # Loopback only: a "local verification" default must not listen on
      # every host interface with repository-fixed credentials (CR #36 P2-3).
      - "127.0.0.1:55432:5432"
